seed: 3407
device: auto

model:
  base: 16
  feat_base: 16
  color_ch: 3
  feat_ch: 9
  out_ch: 3

tiling:
  tile_size: 64
  tile_expand: 8
  min_ratio: 0.01

loss:
  pixel_loss: l1
  w_hole: 1.0
  w_alpha: 0.1
  w_edge: 0.1
  boundary_ignore: 2
  include_boundary_in_total: false

data:
  # Each entry is a processed sequence directory containing Buffer.frame.npy.
  train_sequences: []
  val_sequences: []
  batch_size: 1
  num_workers: 4
  pin_memory: true

training:
  epochs: 100
  learning_rate: 0.0004
  milestones: [20, 40, 60, 70, 80, 90]
  gamma: 0.5
  output: outputs/train
